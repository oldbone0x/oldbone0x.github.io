<svg xmlns="http://www.w3.org/2000/svg" width="560" height="984" viewBox="0 0 560 984" role="img" aria-labelledby="matrix-title matrix-desc"><title id="matrix-title">自建外购决策四种情况手机版</title><desc id="matrix-desc">四个象限对应需求稳定性与自建经济优势的组合，分别是评估自建、购买服务、先做试点或按需租赁。</desc><rect x="0" y="0" width="560" height="984" rx="22" fill="#F8FAFC" stroke="none"/><text x="27" y="51" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="30" fill="#142940" font-weight="700" >自建还是购买？</text><text x="27" y="88" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#687C8F"  >用两个维度先筛，再审查风险</text><rect x="25" y="116" width="510" height="179" rx="17" fill="#DDF3EA" stroke="#B7E2D2"/><text x="48" y="155" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#157E6D"  >需求稳定 · 自建更划算</text><text x="48" y="203" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="29" fill="#157E6D" font-weight="700" >优先评估自建</text><text x="48" y="249" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#576F82"  >适合高频、长期复用的能力</text><rect x="25" y="312" width="510" height="179" rx="17" fill="#EAF1F8" stroke="#D5E0EA"/><text x="48" y="351" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#476987"  >需求稳定 · 自建不划算</text><text x="48" y="399" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="29" fill="#476987" font-weight="700" >倾向购买服务</text><text x="48" y="445" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#576F82"  >需求稳定，也未必值得重投入</text><rect x="25" y="508" width="510" height="179" rx="17" fill="#FFF1D8" stroke="#F0DDAE"/><text x="48" y="547" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#996B20"  >需求不稳 · 自建似乎划算</text><text x="48" y="595" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="29" fill="#996B20" font-weight="700" >先做小规模验证</text><text x="48" y="641" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#576F82"  >验证真实利用率和收益后再投</text><rect x="25" y="704" width="510" height="179" rx="17" fill="#EDF1F5" stroke="#DCE4EB"/><text x="48" y="743" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#566D80"  >需求不稳 · 自建不划算</text><text x="48" y="791" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="29" fill="#566D80" font-weight="700" >按需购买或租赁</text><text x="48" y="837" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#576F82"  >保留灵活性，避免资产闲置</text><text x="280" y="925" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" fill="#5E7588"  text-anchor="middle">这是决策辅助，不是资本化标准</text><text x="280" y="958" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" fill="#5E7588"  text-anchor="middle">还需考虑合规、控制权与退出成本</text></svg>