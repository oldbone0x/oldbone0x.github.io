<svg xmlns="http://www.w3.org/2000/svg" width="560" height="833" viewBox="0 0 560 833" role="img" aria-labelledby="cost-title cost-desc"><title id="cost-title">五年质检方案成本比较移动版</title><desc id="cost-desc">所有数字均为演示假设：人工2500万元，自建2150万元（800万元首投和1350万元后续），设备即服务1650万元。</desc><rect x="0" y="0" width="560" height="833" rx="22" fill="#F8FAFC" stroke="none"/><text x="27" y="51" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="30" fill="#142940" font-weight="700" >五年成本，谁更划算？</text><text x="27" y="85" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="20" fill="#687C8F"  >工厂质检 · 单位：万元 · 演示假设</text><rect x="25" y="121" width="510" height="177" rx="16" fill="#FFF" stroke="#DEE7EF"/><text x="46" y="171" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" fill="#334B63" font-weight="700" >保留人工</text><text x="511" y="171" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="30" fill="#243B53" font-weight="700" text-anchor="end">2,500</text><rect x="46" y="193" width="460" height="39" rx="10" fill="#E7EDF3" stroke="none"/><rect x="46" y="193" width="460" height="39" rx="8" fill="#8798AA" stroke="none"/><text x="46" y="269" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#5D768A"  >每年 500 × 5</text><rect x="25" y="313" width="510" height="177" rx="16" fill="#FFF" stroke="#DEE7EF"/><text x="46" y="363" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" fill="#334B63" font-weight="700" >自建视觉检测</text><text x="511" y="363" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="30" fill="#243B53" font-weight="700" text-anchor="end">2,150</text><rect x="46" y="385" width="460" height="39" rx="10" fill="#E7EDF3" stroke="none"/><rect x="46" y="385" width="147.2" height="39" rx="8" fill="#355F9F" stroke="none"/><rect x="193.2" y="385" width="248.4" height="39" rx="8" fill="#829BC4" stroke="none"/><text x="46" y="461" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#5D768A"  >首投 800 + 后续 1,350</text><rect x="25" y="505" width="510" height="177" rx="16" fill="#FFF" stroke="#DEE7EF"/><text x="46" y="555" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" fill="#334B63" font-weight="700" >设备即服务</text><text x="511" y="555" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="30" fill="#14836F" font-weight="700" text-anchor="end">1,650</text><rect x="46" y="577" width="460" height="39" rx="10" fill="#E7EDF3" stroke="none"/><rect x="46" y="577" width="303.6" height="39" rx="8" fill="#159B85" stroke="none"/><text x="46" y="653" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#5D768A"  >每年 330 × 5</text><rect x="27" y="706" width="506" height="109" rx="13" fill="#E9EFF5" stroke="none"/><text x="44" y="741" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="23" fill="#304C67" font-weight="700" >自建比人工少 350 万</text><text x="44" y="773" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#4D687E"  >但比设备即服务多 500 万</text><text x="44" y="800" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" fill="#8290A0"  >未计税费、折现、质量和停机</text></svg>