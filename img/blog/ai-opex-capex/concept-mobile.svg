<svg xmlns="http://www.w3.org/2000/svg" width="560" height="830" viewBox="0 0 560 830" role="img" aria-labelledby="c-title c-desc"><title id="c-title">运营支出与资本性支出手机版对比</title><desc id="c-desc">OPEX持续购买服务，CAPEX投资建设设备或符合条件的软件，仍有维护折旧和技术风险，资本化须按会计准则。</desc><rect x="0" y="0" width="560" height="830" rx="22" fill="#F8FAFC" stroke="none"/><text x="27" y="51" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="30" fill="#142940" font-weight="700" >两种获得生产力的方式</text><text x="27" y="85" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#687C8F"  >同一需求，投入方式不同</text><rect x="25" y="116" width="510" height="287" rx="17" fill="#FFF" stroke="#D9E4EE"/><text x="52" y="171" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="29" fill="#315F91" font-weight="700" >OPEX · 持续购买</text><rect x="49" y="201" width="194" height="81" rx="15" fill="#E8F0F8" stroke="none"/><rect x="315" y="201" width="193" height="81" rx="15" fill="#E8F0F8" stroke="none"/><text x="146" y="235" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="25" fill="#315F91" font-weight="700" text-anchor="middle">按期支付</text><text x="146" y="264" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="20" fill="#647B91"  text-anchor="middle">人工 / SaaS</text><text x="410" y="235" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="25" fill="#315F91" font-weight="700" text-anchor="middle">当期使用</text><text x="410" y="264" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="20" fill="#647B91"  text-anchor="middle">按量获得</text><text x="274" y="246" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="30" fill="#6484A4" font-weight="700" text-anchor="middle">→</text><text x="52" y="332" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="22" fill="#354B63" font-weight="700" >优势：灵活、前期投入低</text><text x="52" y="370" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#697D90"  >代价：费用持续发生</text><rect x="25" y="420" width="510" height="288" rx="17" fill="#FFF" stroke="#D9E4EE"/><text x="52" y="476" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="29" fill="#158372" font-weight="700" >CAPEX · 投资建设</text><rect x="49" y="506" width="194" height="81" rx="15" fill="#E6F4EE" stroke="none"/><rect x="315" y="506" width="193" height="81" rx="15" fill="#E6F4EE" stroke="none"/><text x="146" y="540" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="25" fill="#168575" font-weight="700" text-anchor="middle">前期投入</text><text x="146" y="569" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="20" fill="#5D837A"  text-anchor="middle">设备 / 系统</text><text x="410" y="540" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="25" fill="#168575" font-weight="700" text-anchor="middle">多年使用</text><text x="410" y="569" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="20" fill="#5D837A"  text-anchor="middle">持续产出</text><text x="274" y="551" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="30" fill="#61A998" font-weight="700" text-anchor="middle">→</text><text x="52" y="636" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="22" fill="#354B63" font-weight="700" >优势：长期复用、自主控制</text><text x="52" y="674" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" fill="#697D90"  >代价：维护、折旧、技术风险</text><rect x="25" y="727" width="510" height="78" rx="12" fill="#E9EEF4" stroke="none"/><text x="280" y="760" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="22" fill="#4C6379" font-weight="700" text-anchor="middle">经营选择 ≠ 会计分类</text><text x="280" y="788" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" fill="#64788C"  text-anchor="middle">具体资本化要满足会计条件</text></svg>