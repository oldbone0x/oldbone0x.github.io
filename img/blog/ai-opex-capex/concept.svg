<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="c-title c-desc">
<title id="c-title">运营支出与资本性支出，两种投入方式</title>
<desc id="c-desc">左侧持续购买服务，每期支付获得当期能力；右侧先投资设备或符合确认条件的软件，多年使用但仍需运营维护。图为经营决策示意，实际会计分类须按准则确认。</desc>
<rect width="900" height="480" rx="24" fill="#F8FAFC"/>
<text x="39" y="55" font-size="29" font-weight="700" fill="#15263D" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">同一项业务需求，两种投入方式</text>
<text x="39" y="88" font-size="18" fill="#637387" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">看的是生产能力如何获得，不是把工资改记成资产</text>
<rect x="38" y="118" width="399" height="283" rx="20" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="2"/>
<rect x="463" y="118" width="399" height="283" rx="20" fill="#FFFFFF" stroke="#DDE6EE" stroke-width="2"/>
<circle cx="77" cy="159" r="15" fill="#E4EDF8"/>
<path d="M71 159h12m-5 -5 5 5 -5 5" stroke="#426B9B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="501" cy="159" r="15" fill="#DCEFEA"/>
<path d="M501 150v18m-9 -9h18" stroke="#188374" stroke-width="2.5" stroke-linecap="round"/>
<text x="105" y="166" font-size="24" font-weight="700" fill="#243750" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">OPEX：持续购买</text>
<text x="529" y="166" font-size="24" font-weight="700" fill="#243750" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">CAPEX：投资建设</text>
<rect x="60" y="200" width="151" height="81" rx="13" fill="#EDF3F9"/>
<rect x="254" y="200" width="157" height="81" rx="13" fill="#EDF3F9"/>
<text x="135" y="234" text-anchor="middle" font-size="21" font-weight="700" fill="#29527E" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">持续支付</text>
<text x="135" y="259" text-anchor="middle" font-size="17" fill="#60758A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">人工 / SaaS</text>
<text x="332" y="234" text-anchor="middle" font-size="21" font-weight="700" fill="#29527E" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">当期服务</text>
<text x="332" y="259" text-anchor="middle" font-size="17" fill="#60758A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">按用量获得</text>
<path d="M218 241h27m-8 -7 8 7 -8 7" stroke="#7195B4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="485" y="200" width="154" height="81" rx="13" fill="#E8F5F1"/>
<rect x="682" y="200" width="154" height="81" rx="13" fill="#E8F5F1"/>
<text x="562" y="234" text-anchor="middle" font-size="21" font-weight="700" fill="#137968" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">前期投入</text>
<text x="562" y="259" text-anchor="middle" font-size="17" fill="#49756D" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">设备 / 软件</text>
<text x="759" y="234" text-anchor="middle" font-size="21" font-weight="700" fill="#137968" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">多年使用</text>
<text x="759" y="259" text-anchor="middle" font-size="17" fill="#49756D" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">形成生产能力</text>
<path d="M646 241h27m-8 -7 8 7 -8 7" stroke="#61A698" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<line x1="60" x2="412" y1="313" y2="313" stroke="#E9EFF5" stroke-width="2"/>
<line x1="485" x2="837" y1="313" y2="313" stroke="#E9EFF5" stroke-width="2"/>
<text x="62" y="347" font-size="19" font-weight="700" fill="#33465B" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">优势：调整灵活、前期投入低</text>
<text x="62" y="374" font-size="17" fill="#617285" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">代价：费用持续发生</text>
<text x="488" y="347" font-size="19" font-weight="700" fill="#33465B" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">优势：可长期使用、持续复用</text>
<text x="488" y="374" font-size="17" fill="#617285" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">代价：维护、折旧与技术风险</text>
<rect x="38" y="416" width="824" height="43" rx="12" fill="#E9EEF4"/>
<text x="450" y="443" text-anchor="middle" font-size="17" font-weight="600" fill="#4C5E74" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif">经营选择 ≠ 会计分类；最终是否资本化仍须满足资产确认条件</text>
</svg>