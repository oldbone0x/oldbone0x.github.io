<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 850" width="680" height="850" role="img" aria-labelledby="title desc">
<title id="title">手机与云台相机的适用场景</title><desc id="desc">手机适合抓拍、照片和轻装；Pocket 适合稳定跟拍和计划性视频，但需要防护。</desc>
<rect width="680" height="850" rx="25" fill="#F7F5EF"/>
<text x="32" y="66" font-size="29" font-weight="700" fill="#202D32" font-family="sans-serif">按场景选设备</text>
<text x="32" y="102" font-size="19" fill="#5F6D72" font-family="sans-serif">不是画质跑分，而是操作体验</text>
<rect x="30" y="136" width="620" height="280" rx="20" fill="#E9F1EC" stroke="#AFC7B8"/>
<circle cx="72" cy="185" r="21" fill="#41775C"/><text x="72" y="194" font-size="23" text-anchor="middle" fill="white" font-family="sans-serif">✓</text>
<text x="111" y="194" font-size="29" font-weight="700" fill="#1E4E38" font-family="sans-serif">iPhone 15｜随手记录</text>
<text x="65" y="260" font-size="25" fill="#233D32" font-family="sans-serif">抓拍表情、拍照片和合照</text>
<text x="65" y="318" font-size="25" fill="#233D32" font-family="sans-serif">轻装出行，拍完可直接分享</text>
<text x="65" y="376" font-size="25" fill="#233D32" font-family="sans-serif">雨天更从容*</text>
<rect x="30" y="446" width="620" height="280" rx="20" fill="#EDF1F7" stroke="#B6C6D8"/>
<circle cx="72" cy="495" r="21" fill="#527CA7"/><path d="M61 495h22M72 484v22" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
<text x="111" y="505" font-size="29" font-weight="700" fill="#254E77" font-family="sans-serif">Pocket 4｜有计划地拍</text>
<text x="65" y="570" font-size="25" fill="#2B435B" font-family="sans-serif">边走边拍、平稳移动镜头</text>
<text x="65" y="628" font-size="25" fill="#2B435B" font-family="sans-serif">智能跟随，独立设备</text>
<text x="65" y="686" font-size="25" fill="#2B435B" font-family="sans-serif">更需要收纳、防水防沙</text>
<text x="34" y="773" font-size="18" fill="#5F6D72" font-family="sans-serif">* 手机防水能力也有使用条件；</text>
<text x="34" y="804" font-size="18" fill="#5F6D72" font-family="sans-serif">请以官方说明为准。</text></svg>