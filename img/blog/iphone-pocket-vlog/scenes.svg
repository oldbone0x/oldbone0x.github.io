<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-labelledby="title desc">
<title id="title">手机与云台相机的适用场景</title><desc id="desc">在突发抓拍、拍照和恶劣天气下优先用手机；平稳的行走拍摄和跟随更适合三轴云台；两者互补。</desc>
<rect width="1120" height="420" rx="24" fill="#F7F5EF"/>
<text x="56" y="69" font-size="30" font-weight="700" fill="#202D32" font-family="sans-serif">按场景选设备，别只看参数</text>
<text x="56" y="104" font-size="17" fill="#5F6D72" font-family="sans-serif">下面比较的是操作体验，不是画质跑分</text>
<rect x="56" y="138" width="480" height="224" rx="19" fill="#E9F1EC" stroke="#AFC7B8"/>
<rect x="584" y="138" width="480" height="224" rx="19" fill="#EDF1F7" stroke="#B6C6D8"/>
<circle cx="94" cy="185" r="19" fill="#41775C"/><text x="94" y="192" font-size="23" text-anchor="middle" fill="white" font-family="sans-serif">✓</text>
<text x="130" y="193" font-size="25" font-weight="700" fill="#1E4E38" font-family="sans-serif">iPhone 15：随手记录</text>
<text x="90" y="246" font-size="20" fill="#233D32" font-family="sans-serif">抓拍表情、拍照片、合照</text>
<text x="90" y="290" font-size="20" fill="#233D32" font-family="sans-serif">少带一台设备，方便分享</text>
<text x="90" y="334" font-size="20" fill="#233D32" font-family="sans-serif">雨天徒步更从容*</text>
<circle cx="622" cy="185" r="19" fill="#527CA7"/><path d="M612 185h20M622 175v20" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
<text x="656" y="193" font-size="25" font-weight="700" fill="#254E77" font-family="sans-serif">Pocket 4：有计划地拍</text>
<text x="618" y="246" font-size="20" fill="#2B435B" font-family="sans-serif">行走跟拍、平稳转镜头</text>
<text x="618" y="290" font-size="20" fill="#2B435B" font-family="sans-serif">智能跟随、独立拍摄设备</text>
<text x="618" y="334" font-size="20" fill="#2B435B" font-family="sans-serif">更需要收纳与防护</text>
<text x="56" y="396" font-size="15" fill="#5F6D72" font-family="sans-serif">*手机具备防水设计也不等于可以随意浸水；请遵循设备官方使用条件。</text></svg>