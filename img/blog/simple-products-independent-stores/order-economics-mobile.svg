<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 555" role="img" aria-labelledby="title desc"><title id="title">249 元模拟订单成本拆分</title><desc id="desc">收入 249 元，成本与预留共 220 元，剩余贡献利润 29 元；所有金额仅为示意假设。</desc><rect width="420" height="555" rx="18" fill="#fbfaf7"/><text x="24" y="42" fill="#263443" font-size="24" font-weight="700">249 元订单，剩余 29 元</text><text x="24" y="73" fill="#69717a" font-size="15">模拟成本，不是实际物流报价</text><defs><clipPath id="bar"><rect x="24" y="112" width="372" height="54" rx="9"/></clipPath></defs><g clip-path="url(#bar)"><rect x="24.00" y="112" width="74.70" height="54" fill="#6382a0"/><rect x="98.70" y="112" width="104.58" height="54" fill="#729d94"/><rect x="203.28" y="112" width="44.82" height="54" fill="#c29a5f"/><rect x="248.10" y="112" width="14.94" height="54" fill="#a092b6"/><rect x="263.04" y="112" width="74.70" height="54" fill="#b77f7b"/><rect x="337.73" y="112" width="14.94" height="54" fill="#9ba3a9"/><rect x="352.67" y="112" width="43.33" height="54" fill="#398568"/></g><rect x="28" y="195" width="16" height="16" rx="3" fill="#6382a0"/><text x="56" y="209" fill="#293441" font-size="18">货品与包装</text><text x="389" y="209" fill="#293441" font-size="18" font-weight="600" text-anchor="end">50 元</text>
