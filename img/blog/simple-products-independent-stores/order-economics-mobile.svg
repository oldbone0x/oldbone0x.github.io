<rect x="28" y="281" width="16" height="16" rx="3" fill="#c29a5f"/><text x="56" y="295" fill="#293441" font-size="18">税费清关预留</text><text x="389" y="295" fill="#293441" font-size="18" font-weight="600" text-anchor="end">30 元</text>
